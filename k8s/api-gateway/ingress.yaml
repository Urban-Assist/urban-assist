apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  annotations:
    # Global CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With, X-Api-Key"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Path handling
    nginx.ingress.kubernetes.io/use-regex: "true"
    
    # SPA handling - try files approach
    nginx.ingress.kubernetes.io/configuration-snippet: |
      try_files $uri $uri/ /index.html;
    
    # Performance tuning
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

    # SSL and security
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # Additional annotations
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"

spec:
  rules:
  - host: advancedweb-vm4.research.cs.dal.ca
    http:
      paths:
      # Backend services first (ordered by specificity)
      - path: /auth-api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: user-auth
            port:
              number: 8081
      - path: /mail(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: email-service
            port:
              number: 8084
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: user-management
            port:
              number: 8083
      - path: /payments(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8085
      - path: /admin(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 8086
      - path: /reviews(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: reviews-service
            port:
              number: 8089
            
      # Frontend service last to catch all other routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

