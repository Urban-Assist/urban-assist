# k8s/user-auth/db/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth-mysql
spec:
  selector:
    matchLabels:
      app: user-auth-mysql
  template:
    metadata:
      labels:
        app: user-auth-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        envFrom:
        - secretRef:
            name: user-auth-db-secrets
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: user-auth-mysql-pv-claim