apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-mysql
spec:
  selector:
    matchLabels:
      app: user-management-mysql
  template:
    metadata:
      labels:
        app: user-management-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        envFrom:
        - secretRef:
            name: user-management-mysql-secrets
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: user-management-mysql-pvc