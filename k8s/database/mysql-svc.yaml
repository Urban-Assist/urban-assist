apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  ports:
    - protocol: TCP
      port: 5151           # Service's internal port (cluster-internal endpoint)
      targetPort: 3306     # Port on the pod where MySQL is listening
      nodePort: 30001      # External port exposed on all nodes in the cluster
  selector:
    app: mysql             # Routes to pods with this label
  type: NodePort           # Makes service accessible from outside the cluster